# Render Blueprint: https://render.com/docs/blueprint-spec
# Deploy: Render dashboard → New → Blueprint → select this repo.
#
# Everything runs on Render's free tier:
# - The backend installs requirements-core.txt only (no PyTorch). Embeddings
#   run on ONNX, which keeps peak memory under the free tier's 512MB
#   (~340MB measured on Linux; CI enforces a 400MB budget).
# - AI simplification uses the Gemini API. Set GEMINI_API_KEY in the Render
#   dashboard (it's never stored in this file). Text is de-identified before
#   it is sent. There's no local model to fall back to here, so without a
#   key, or while Gemini is down, /simplify returns 503.
# - Free services sleep after 15 minutes idle (about 1 minute to wake up)
#   and have no persistent disk, so uploaded documents are cleared whenever
#   the backend restarts or sleeps.

services:
  # ---------------------------------------------------------------- backend
  - type: web
    name: patient-comm-api
    runtime: python
    plan: free
    region: oregon
    # Models are downloaded at build time into the project directory, which
    # is kept for runtime, so cold starts don't re-download them
    buildCommand: >-
      pip install --upgrade pip &&
      pip install -r requirements-core.txt &&
      python -m app.warmup
    # A single worker: app state (vector store, models) lives in-process
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeployTrigger: checksPass # deploy main only after CI passes
    buildFilter:
      ignoredPaths:
        - frontend/**
        - "**/*.md"
    envVars:
      - key: ENABLE_LLM
        value: "true"
      # Prompted for in the dashboard when the Blueprint is applied
      - key: GEMINI_API_KEY
        sync: false
      # Quota protection for the public demo
      - key: LLM_REQUESTS_PER_MINUTE
        value: "10"
      - key: LLM_REQUESTS_PER_DAY
        value: "500"
      - key: MODEL_CACHE_DIR
        value: .models
      - key: TIKTOKEN_CACHE_DIR
        value: .models/tiktoken
      # CMU dictionary for readability syllable counts
      - key: NLTK_DATA
        value: .models/nltk_data

  # --------------------------------------------------------------- frontend
  - type: web
    name: patient-comm-assistant
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - frontend/**
    routes:
      # Proxy API calls to the backend so the browser stays same-origin.
      # If Render gives the backend a different URL (shown on its dashboard
      # page), update the destination here.
      - type: rewrite
        source: /api/*
        destination: https://patient-comm-api.onrender.com/*
      # SPA fallback
      - type: rewrite
        source: /*
        destination: /index.html
